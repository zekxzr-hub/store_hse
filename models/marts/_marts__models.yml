
version: 2

models:
  - name: fct_orders
    description: >
      Факт заказов: одна строка — один заказ. Тестовые заказы исключены.
      К заказу пристыкованы итоги по платежам; подтверждённая покупка — статус paid
      и хотя бы одна успешная оплата (возврат оплатой не считается).
    columns:
      - name: order_id
        description: "Номер заказа."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Клиент, оформивший заказ."
      - name: order_date
        description: "Дата заказа."
      - name: ordered_at
        description: "Время оформления заказа."
      - name: order_status
        description: "Статус заказа: paid, pending, returned, cancelled."
      - name: order_amount
        description: "Сумма заказа в рублях после скидок."
        data_tests: [non_negative]
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
        data_tests: [non_negative]
      - name: refunded_amount
        description: "Сумма возвратов положительным числом; 0, если возвратов нет."
        data_tests: [non_negative]
      - name: net_paid_amount
        description: "Оплачено минус возвращено."
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."
      - name: first_paid_at
        description: "Время первой успешной оплаты; пусто, если оплат нет."
      - name: is_confirmed
        description: "Подтверждённая покупка: статус paid и хотя бы одна успешная оплата."
        data_tests: [not_null]
      - name: items_count
        description: "Количество разных товаров в заказе."
        data_tests: [not_null, non_negative]

  - name: fct_order_items
    description: "Товарные позиции заказов."
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: order_date
      - name: quantity
        data_tests: [non_negative]
      - name: unit_price
        data_tests: [non_negative]
      - name: discount_amount
        data_tests: [non_negative]
      - name: line_amount
        data_tests: [non_negative]

  - name: dim_customers
    description: "Измерение клиентов."
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: dim_products
    description: "Измерение товаров."
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: dim_dates
    description: "Календарное измерение."
    columns:
      - name: order_date
        data_tests: [unique, not_null]
